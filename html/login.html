<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Friendship On Wheels</title>
    <link rel="icon" href="../src/icon.svg">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<main class="login-page">
    <section class="login-card">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Sign in to continue your service</p>
        </div>
        <div class="role-switch">
            <button class="role-btn active">Volunteer</button>
            <button class="role-btn">Coordinator</button>
        </div>
        <div class="userid">
            <label>User ID</label>
            <input type="text" placeholder="Enter User ID">
        </div>
        <div class="password">
            <label>Password</label>
            <input type="password" placeholder="Enter Password">
        </div>
        <div class="button">
            <button class="login-btn">Sign In</button>
        </div>
        <div class ="forgot-psw"><a href="#">Forgot Password?</a></div>
        <div class ="register"><a href="#">Register</a></div>
    </section>
</main>

</body>
</html>
